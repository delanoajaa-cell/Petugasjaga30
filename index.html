function isSpecialExclusionMonday(dateObj) {
  const isMonday = dateObj.getDay() === 1;
  const month = dateObj.getMonth(); // 10 = November
  const day = dateObj.getDate();
  return isMonday && month === 10 && day >= 2 && day <= 23;
}

function formatIndonesianDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ALGORITMA PENILAIAN BEBAN & ROTASI
function getCandidateScore(member, targetDate) {
  const dutyCount = appState.memberDutyCount[member.id] || 0;
  const lastDate = appState.lastGuardedDate[member.id];
  let score = dutyCount * 10;

  if (lastDate) {
    const diffDays = Math.floor((new Date(targetDate) - new Date(lastDate)) / (1000 * 60 * 60 * 24));
    if (diffDays === 1) score += 40;
    else if (diffDays === 2) score += 15;
  }
  score += Math.random() * 2;
  return score;
}

function pickMembers(pool, count, excludeIds, assignedSet, targetDate) {
  const candidates = pool.filter(m => !excludeIds.has(m.id));
  candidates.sort((a, b) => getCandidateScore(a, targetDate) - getCandidateScore(b, targetDate));
  const picked = candidates.slice(0, count);
  picked.forEach(m => {
    excludeIds.add(m.id);
    assignedSet.add(m.id);
  });
  return picked;
}

// Pemilihan Khusus Cowo / Cewe untuk Cek Kamar Mandi
function pickMemberByGender(pool, gender, excludeIds, assignedSet, targetDate) {
  const candidates = pool.filter(m => !excludeIds.has(m.id) && m.gender === gender);
  if (candidates.length === 0) {
    return pickMembers(pool, 1, excludeIds, assignedSet, targetDate)[0];
  }
  candidates.sort((a, b) => getCandidateScore(a, targetDate) - getCandidateScore(b, targetDate));
  const chosen = candidates[0];
  excludeIds.add(chosen.id);
  assignedSet.add(chosen.id);
  return chosen;
}

function pickHTCoordinator(excludeIds, assignedSet, targetDate) {
  const candidates = HT_SPECIAL_CANDIDATES.filter(m => !excludeIds.has(m.id));
  candidates.sort((a, b) => {
    const countA = (appState.htHistory[a.id] || 0) + (appState.memberDutyCount[a.id] || 0) * 0.5;
    const countB = (appState.htHistory[b.id] || 0) + (appState.memberDutyCount[b.id] || 0) * 0.5;
    return countA - countB + (Math.random() * 2 - 1);
  });
  const chosen = candidates[0];
  excludeIds.add(chosen.id);
  assignedSet.add(chosen.id);
  return chosen;
}

  // Lantai 3: Kelas 8 (1 Cowo & 1 Cewe)
  const lt3_cowo = pickMemberByGender(MEMBERS_CLASS_8, 'L', excludeIds, assignedSet, dateStr);
  const lt3_cewe = pickMemberByGender(MEMBERS_CLASS_8, 'P', excludeIds, assignedSet, dateStr);
  const lantai3 = [lt3_cewe, lt3_cowo];

  // Lantai 4: Kelas 7 (1 Cowo & 1 Cewe)
  const lt4_cowo = pickMemberByGender(MEMBERS_CLASS_7, 'L', excludeIds, assignedSet, dateStr);
  const lt4_cewe = pickMemberByGender(MEMBERS_CLASS_7, 'P', excludeIds, assignedSet, dateStr);
  const lantai4 = [lt4_cewe, lt4_cowo];

  // 4. Penjaga Gerbang Depan: 2 orang Kelas 8
  const gerbangDepan = pickMembers(MEMBERS_CLASS_8, 2, excludeIds, assignedSet, dateStr);

  // 5. Tangga Timur: Kls 8 (2 orang), Kls 7 (2 orang)
  const tanggaTimur_c8 = pickMembers(MEMBERS_CLASS_8, 2, excludeIds, assignedSet, dateStr);
  const tanggaTimur_c7 = pickMembers(MEMBERS_CLASS_7, 2, excludeIds, assignedSet, dateStr);
  const tanggaTimur_ishoma = { c8: tanggaTimur_c8[0], c7: tanggaTimur_c7[0] };

  // 6. Tangga Barat: Kls 8 (2 orang), Kls 7 (2 orang)
  const tanggaBarat_c8 = pickMembers(MEMBERS_CLASS_8, 2, excludeIds, assignedSet, dateStr);
  const tanggaBarat_c7 = pickMembers(MEMBERS_CLASS_7, 2, excludeIds, assignedSet, dateStr);
  const tanggaBarat_ishoma = { c8: tanggaBarat_c8[0], c7: tanggaBarat_c7[0] };

  // 7. Parkiran Barat: Kls 8 (2 orang), Kls 7 (2 orang)
  const parkiran_c8 = pickMembers(MEMBERS_CLASS_8, 2, excludeIds, assignedSet, dateStr);
  const parkiran_c7 = pickMembers(MEMBERS_CLASS_7, 2, excludeIds, assignedSet, dateStr);
  const parkiran_ishoma = { c8: parkiran_c8[0], c7: parkiran_c7[0] };
  const parkiran_non_ishoma = { c8: parkiran_c8[1], c7: parkiran_c7[1] };

  const regularSchedule = {
    date: dateStr,
    isFriday: isFriday,
    isMonday: isMonday,
    ht: htCoordinator,
    tanggaTimur: { c8: tanggaTimur_c8, c7: tanggaTimur_c7, ishoma: tanggaTimur_ishoma },
    tanggaBarat: { c8: tanggaBarat_c8, c7: tanggaBarat_c7, ishoma: tanggaBarat_ishoma },
    gerbang: gerbangDepan,
    parkiran: { c8: parkiran_c8, c7: parkiran_c7, ishoma: parkiran_ishoma, nonIshoma: parkiran_non_ishoma },
    lantai: { lt2: lantai2, lt3: lantai3, lt4: lantai4 }
  };

  // 8. TUGAS KHUSUS SENIN (UPACARA) - Dari petugas jaga hari itu
  let upacaraSchedule = null;
  if (isMonday) {
    upacaraSchedule = {
      date: dateStr,
      barisan_8A_8B: [parkiran_non_ishoma.c8, parkiran_non_ishoma.c7],
      barisan_8C_8D: [parkiran_ishoma.c8, parkiran_ishoma.c7],
      barisan_8E_8F: [lantai2[0], lantai2[1]],
      barisan_8G_8H: [lantai3[0], lantai3[1]],
      barisan_7A_7B: [lantai4[0], lantai4[1]],
      barisan_7C_7D: [gerbangDepan[0], gerbangDepan[1]],
      barisan_7E_7F: [tanggaBarat_c8[0], tanggaBarat_c8[1]],
      barisan_7G_7H: [tanggaTimur_c8[0], tanggaTimur_c8[1]]
    };
  }

  appState.dutyHistory[dateStr] = {
    regular: regularSchedule,
    upacara: upacaraSchedule
  };

  assignedSet.forEach(id => {
    appState.memberDutyCount[id] = (appState.memberDutyCount[id] || 0) + 1;
    appState.lastGuardedDate[id] = dateStr;
  });
  if (htCoordinator) {
    appState.htHistory[htCoordinator.id] = (appState.htHistory[htCoordinator.id] || 0) + 1;
  }

  saveLocalState();
  syncToCloud();

  renderScheduleToUI(regularSchedule, upacaraSchedule);
}

function renderExistingSchedule(dateStr) {
  const item = appState.dutyHistory[dateStr];
  if (item) {
    renderScheduleToUI(item.regular, item.upacara);
  }
}

    text += `- Istirahat kelas 7:  ${reg.tanggaBarat.c7[0].call} & ${reg.tanggaBarat.c7[1].call}\n`;
    if (!reg.isFriday) {
      text += `- Ishoma: ${reg.tanggaBarat.ishoma.c8.call} & ${reg.tanggaBarat.ishoma.c7.call}\n`;
    }

    text += `\n*2. Penjaga Gerbang Depan*\n\n`;

function copyToClipboard(type) {
  const text = buildWhatsAppText(type);
  if (!text) {
    showToast("Jadwal belum dibuat!", true);
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    showToast(type === 'harian' ? "Format WA Jadwal Jaga disalin!" : "Format WA Tugas Upacara disalin!");
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast("Teks berhasil disalin!");
  });
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  toastMsg.textContent = msg;
  toast.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 ${isError ? 'bg-rose-900/95' : 'bg-slate-900/95'} text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg transition-all duration-200 opacity-100 flex items-center gap-2 pointer-events-auto`;
  setTimeout(() => {
    toast.className = "fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg transition-all duration-200 opacity-0 pointer-events-none flex items-center gap-2";
  }, 2200);
}

function renderMemberStats() {
  const allMembers = [...MEMBERS_CLASS_8, ...MEMBERS_CLASS_7];
  allMembers.sort((a, b) => (appState.memberDutyCount[b.id] || 0) - (appState.memberDutyCount[a.id] || 0));

  const maxDuty = allMembers[0] ? (appState.memberDutyCount[allMembers[0].id] || 0) : 0;
  const minDuty = allMembers[allMembers.length - 1] ? (appState.memberDutyCount[allMembers[allMembers.length - 1].id] || 0) : 0;

  const html = `
    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
      <span class="text-slate-500 block text-[11px]">Beban Terbanyak</span>
      <span class="text-sm font-extrabold text-blue-900">${maxDuty} kali</span>
    </div>
    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
      <span class="text-slate-500 block text-[11px]">Beban Tersedikit</span>
      <span class="text-sm font-extrabold text-emerald-800">${minDuty} kali</span>
    </div>
    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
      <span class="text-slate-500 block text-[11px]">Selisih Rotasi</span>
      <span class="text-sm font-extrabold text-slate-700">${maxDuty - minDuty} tugas</span>
    </div>
    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
      <span class="text-slate-500 block text-[11px]">Status Rotasi</span>
      <span class="text-xs font-extrabold text-emerald-700 flex items-center gap-1 mt-0.5">
        <i class="fa-solid fa-check"></i> Adil Merata
      </span>
    </div>
  `;
  document.getElementById('statsMemberSummary').innerHTML = html;
}

function loadLocalState() {
  try {
    const raw = localStorage.getItem('osis_duty_app_state');
    if (raw) {
      const parsed = JSON.parse(raw);
      appState.dutyHistory = parsed.dutyHistory || {};
      appState.memberDutyCount = parsed.memberDutyCount || {};
      appState.lastGuardedDate = parsed.lastGuardedDate || {};
      appState.htHistory = parsed.htHistory || {};
    }
  } catch (e) {}
}

function saveLocalState() {
  try {
    localStorage.setItem('osis_duty_app_state', JSON.stringify({
      dutyHistory: appState.dutyHistory,
      memberDutyCount: appState.memberDutyCount,
      lastGuardedDate: appState.lastGuardedDate,
      htHistory: appState.htHistory
    }));
  } catch (e) {}
}

async function initCloudSync() {
  const syncBadge = document.getElementById('cloudStatus');
  const syncText = document.getElementById('syncText');
  try {
    const res = await fetch(SYNC_URL);
    if (res.ok) {
      const data = await res.json();
      if (data && data.data) {
        appState.dutyHistory = { ...appState.dutyHistory, ...(data.data.dutyHistory || {}) };
        appState.memberDutyCount = { ...appState.memberDutyCount, ...(data.data.memberDutyCount || {}) };
        appState.lastGuardedDate = { ...appState.lastGuardedDate, ...(data.data.lastGuardedDate || {}) };
        appState.htHistory = { ...appState.htHistory, ...(data.data.htHistory || {}) };
        saveLocalState();
        renderExistingSchedule(document.getElementById('dutyDate').value);
      }
      syncText.textContent = "Online";
      syncBadge.className = "flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-blue-800 text-blue-200 border border-blue-700";
    }
  } catch (err) {
    syncText.textContent = "Offline (Lokal)";
    syncBadge.className = "flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700";
  }
}

async function syncToCloud() {
  try {
    await fetch(SYNC_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: "OSIS_DUTY_ROTATION_SYNC",
        data: {
          dutyHistory: appState.dutyHistory,
          memberDutyCount: appState.memberDutyCount,
          lastGuardedDate: appState.lastGuardedDate,
          htHistory: appState.htHistory
        }
      })
    });
  } catch (e) {}
}
